name: PR checks
on:
  pull_request:
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      # run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  lint-docker-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - uses: ludeeus/action-shellcheck@2.0.0
        with: { scandir: ./scripts }

  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-task:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
     # - name: Run Trivy vulnerability scanner
     #  with:
     #     image-ref: devops-task:pr
       #   severity: CRITICAL
      #    exit-code: "0"
       #   ignore-unfixed: true
