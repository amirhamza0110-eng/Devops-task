name: Build and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AWS, no static keys
concurrency: { group: deploy, cancel-in-progress: false }

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          VER="$(cut -d. -f1,2 VERSION).${GITHUB_RUN_NUMBER}"   # semver: major.minor from VERSION, patch = run number
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: img
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "image=$REPO:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.image }}
            ${{ steps.img.outputs.repo }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}   # add required reviewers on 'production'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy via SSM (script smoke-tests /health and rolls back on failure)
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"/opt/app/deploy.sh $IMAGE\"]" \
            --query Command.CommandId --output text)
          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy ended with status $STATUS (instance rolled back to previous image if one existed)." >&2
            exit 1
          fi
