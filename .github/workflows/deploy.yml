name: Build and deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AWS, no static keys
concurrency: { group: deploy, cancel-in-progress: false }

env:
  AWS_REGION: us-east-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          VER="$(cut -d. -f1,2 VERSION).${GITHUB_RUN_NUMBER}"   # semver: major.minor from VERSION, patch = run number
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          echo "${P}==" | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}'
          
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::805550189244:role/devops-task-staging-github-ci
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: img
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/devops-task-staging"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "image=$REPO:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.img.outputs.image }}
            ${{ steps.img.outputs.repo }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::805550189244:role/devops-task-staging-github-ci
          aws-region: us-east-1
      - name: Deploy via SSM (script smoke-tests /health and rolls back on failure)
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          INSTANCE_ID: i-085eb67735b32244d
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[\"/opt/app/deploy.sh $IMAGE\"]" \
            --query Command.CommandId --output text)
          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy ended with status $STATUS (instance rolled back to previous image if one existed)." >&2
            exit 1
          fi